<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4 p-4">

        <h2 class="mb-4">
            ✏️ Edit Task
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Task
                </label>

                <input
                    type="text"
                    name="task"
                    class="form-control"
                    value="{{ task.task }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Owner
                </label>

                <input
                    type="text"
                    name="owner"
                    class="form-control"
                    value="{{ task.owner }}">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Due Date
                </label>

                <input
                    type="text"
                    name="due_date"
                    class="form-control"
                    value="{{ task.due_date }}">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Priority
                </label>

                <select
                    name="priority"
                    class="form-select">

                    <option value="High"
                        {% if task.priority=="High" %}selected{% endif %}>
                        High
                    </option>

                    <option value="Medium"
                        {% if task.priority=="Medium" %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="Low"
                        {% if task.priority=="Low" %}selected{% endif %}>
                        Low
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Status
                </label>

                <select
                    name="status"
                    class="form-select">

                    <option value="Pending"
                        {% if task.status=="Pending" %}selected{% endif %}>
                        Pending
                    </option>

                    <option value="Completed"
                        {% if task.status=="Completed" %}selected{% endif %}>
                        Completed
                    </option>

                </select>

            </div>

            <button class="btn btn-success">

                Save Changes

            </button>

            <a href="/dashboard" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>

</html>
